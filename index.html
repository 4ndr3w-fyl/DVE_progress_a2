<!doctype html>
<html lang="en">
  <head>
    <title>&lt;model-viewer&gt; template</title>
    <meta charset="utf-8">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="./styles.css" rel="stylesheet"/>
  </head>
  <body>
    <!-- <model-viewer> HTML element -->
    <model-viewer src="PressPod_DVE_A2.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="poster.png" shadow-intensity="1" auto-rotate camera-orbit="400.4deg 92.14deg 0.6135m" field-of-view="30deg" auto-rotate id="gear" id="gear">

      <button class="Hotspot" slot="hotspot-1" data-position="-0.0812614966120139m 0.2789983854293245m -0.0027762559908739715m" data-normal="6.617444900424222e-24m 0.9999999999999541m -3.0294627932906245e-7m" data-visibility-attribute="visible" onMouseOver="addhotspot1()" onMouseOut="removehotspot1()">
          <div class="HotspotAnnotation" id="hotspot1" style="visibility:hidden" >Screen</div>
      </button>

<button class="Hotspot" slot="hotspot-2" data-position="-0.15541154455206208m 0.24016340833751715m 0.0004926744065445021m" data-normal="-1m -1.262177414858143e-23m -5.551115123125784e-17m" data-visibility-attribute="visible" onMouseOver="addhotspot2()" onMouseOut="removehotspot2()">
          <div class="HotspotAnnotation" id="hotspot2" style="visibility:hidden">User Interface</div>
      </button>

<button class="Hotspot" slot="hotspot-3" data-position="-0.03739666090339773m 0.0572711716041811m 0.0000018316933507768474m" data-normal="0.9985388419514711m 0.012588537168471508m 0.052551972809526185m" data-visibility-attribute="visible" onMouseOver="addhotspot3()" onMouseOut="removehotspot3()">
          <div class="HotspotAnnotation" id="hotspot3" style="visibility:hidden">Heating component</div>
      </button>

<button class="Hotspot" slot="hotspot-4" data-position="-0.04436325292757303m 0.04749060532193014m 0.015525868653054817m" data-normal="0.9101582207583206m 1.2549876904450625e-7m 0.4142608033425713m" data-visibility-attribute="visible" onMouseOver="addhotspot4()" onMouseOut="removehotspot4()">
          <div class="HotspotAnnotation" id="hotspot4" style="visibility:hidden">LED light ring</div>
      </button>

<button class="Hotspot" slot="hotspot-5" data-position="-0.040704488780283224m 0.037679008436512264m 0.0001630670522242625m" data-normal="1m 0m 5.551115123125784e-17m" data-visibility-attribute="visible" onMouseOver="addhotspot5()" onMouseOut="removehotspot5()">
          <div class="HotspotAnnotation" id="hotspot5" style="visibility:hidden">USB-C charging port</div>
      </button>

<button class="Hotspot" slot="hotspot-6" data-position="-0.03653158859225241m 0.018969872950267943m 0.00008696942574512267m" data-normal="0.9459341104585733m 0.12462255007979756m 0.29946264989570254m" data-visibility-attribute="visible" onMouseOver="addhotspot6()" onMouseOut="removehotspot6()">
          <div class="HotspotAnnotation" id="hotspot6" style="visibility:hidden">Storage component</div>
      </button>

      <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
      </div>
      <button slot="ar-button" id="ar-button">
          View in your space
      </button>
      <div id="ar-prompt">
          <img src="ar_hand_prompt.png">

      </div>

	<div style="position:absolute; bottom:0px; left:200px">
	<div>Variant:
	<button onClick="VBtn01()">Intro screen</button>
	<button onClick="VBtn02()">Dashboard screen</button>
	<button onClick="VBtn03()">Cup Heating screen</button>
	<button onClick="VBtn04()">Blue LED ring</button>
	<button onClick="VBtn05()">Red LED ring</button>
	<button onClick="VBtn06()">Green LED ring</button>
	</div>
	</div>

      </div>
	<div style="position:absolute; bottom:0px; right:0px">
	<button onClick="setOrbit('542.9deg 92deg 0.5584m')">Front</button>
	<button onClick="setOrbit('313deg 0.0000573deg 0.4587m')">Top</button>
	<button onClick="setOrbit('423.5deg 93.14deg 0.5861m')">Side</button>
	<button onClick="setOrbit('461.6deg 180deg 0.5726m')">Bottom</button>
	</div>

    </model-viewer>  

<script>

	function VBtn01() {
	document.getElementById('gear').variantName = "Intro"; }
	function VBtn02() {
	document.getElementById('gear').variantName = "Dashboard";}
	function VBtn03() {
	document.getElementById('gear').variantName = "CupHeater";}
	function VBtn04() {
	document.getElementById('gear').variantName = "CyanLED";}
	function VBtn05() {
	document.getElementById('gear').variantName = "RedLED";}
	function VBtn06() {
	document.getElementById('gear').variantName = "GreenLED";}

	function setOrbit(orbit)
		{document.getElementById('gear').cameraOrbit = orbit;}

	function addhotspot1(){
		document.getElementById("hotspot1").style.visibility="visible"
	}
	function removehotspot1(){
		document.getElementById("hotspot1").style.visibility="hidden";
	}

	function addhotspot2(){
		document.getElementById("hotspot2").style.visibility="visible"
	}
	function removehotspot2(){
		document.getElementById("hotspot2").style.visibility="hidden";
	}
	function addhotspot3(){
		document.getElementById("hotspot3").style.visibility="visible"
	}
	function removehotspot3(){
		document.getElementById("hotspot3").style.visibility="hidden";
	}

	function addhotspot4(){
		document.getElementById("hotspot4").style.visibility="visible"
	}
	function removehotspot4(){
		document.getElementById("hotspot4").style.visibility="hidden";
	}
	function addhotspot5(){
		document.getElementById("hotspot5").style.visibility="visible"
	}
	function removehotspot5(){
		document.getElementById("hotspot5").style.visibility="hidden";
	}

	function addhotspot6(){
		document.getElementById("hotspot6").style.visibility="visible"
	}
	function removehotspot6(){
		document.getElementById("hotspot6").style.visibility="hidden";
	}
</script>

    <script src="script.js"></script>
    <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  </body>
</html>
